<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let fruits = ["apple", "Banana", "Kiwi"];
      const animateAll = (animate) => {
        setTimeout(() => {
          animate(fruits[0]);
          setTimeout(() => {
            animate(fruits[1]);
            setTimeout(() => {
              animate(fruits[2]);
            }, 1000);
          }, 1000);
        }, 1000);
      };

      const animate = (fruit) => {
        console.log("animating", fruit);
      };

      animateAll(animate);
    </script>
  </body>
</html>
